name: Windows Portable

on:
  push:
    branches:
      - pr431-build
  workflow_dispatch:

permissions:
  contents: read

jobs:

  windows:
    name: Windows x64 portable (Release)
    runs-on: windows-2022
    timeout-minutes: 330

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          # AyuGram removed docs/building-win.md, so the SDK version from
          # official tdesktop v7.0.1 docs is pinned here instead of parsed.
          SDK="10.0.26100.0"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "windows-2022-vs2022-release-full-v2" >> CACHE_KEY.txt
          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'
          vsversion: '2022'

      - name: Verify build environment.
        run: |
          if /I not "%Platform%"=="x64" exit /b 1
          if not exist "%VCToolsInstallDir%atlmfc\include\atlbase.h" exit /b 1
          if not exist "%VCToolsInstallDir%atlmfc\include\atlcomcli.h" exit /b 1
          if not exist "%VCToolsInstallDir%atlmfc\lib\x64\atls.lib" exit /b 1
          if not exist "%WindowsSdkDir%Include\10.0.26100.0\um\Windows.h" exit /b 1
          where cl
          where link
          where msbuild
          where cmake
          where ninja
          cl /Bv
          cmake --version

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-windows-2022-vs2022-release-full-v2-${{ env.CACHE_KEY }}

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-windows-2022-vs2022-release-full-v2-${{ env.CACHE_KEY }}

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-windows-2022-vs2022-release-full-v2-${{ env.CACHE_KEY }}

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Verify Release libraries.
        run: |
          if not exist "%LibrariesPath%\tg_angle\out\Release\tg_angle.lib" exit /b 1
          if not exist "%LibrariesPath%\libavif\Release\avif.lib" exit /b 1
          if not exist "%LibrariesPath%\local\include\avif\avif.h" exit /b 1
          if not exist "%LibrariesPath%\Qt-5.15.19\lib\Qt5Core.lib" exit /b 1
          if not exist "%LibrariesPath%\Qt-5.15.19\lib\Qt5Gui.lib" exit /b 1
          if not exist "%LibrariesPath%\Qt-5.15.19\lib\Qt5Widgets.lib" exit /b 1

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete

      - name: AyuGram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          -D TDESKTOP_API_ID=611335 ^
          -D TDESKTOP_API_HASH=d524b414d21f4d37f08684c1df41ac9c ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON
          if errorlevel 1 exit /b %errorlevel%

          cmake --build ..\out --config Release --target Telegram --parallel 2
          if errorlevel 1 exit /b %errorlevel%

          if not exist "..\out\Release\AyuGram.exe" exit /b 1
          if not exist "..\out\Release\modules\x64\d3d\d3dcompiler_47.dll" exit /b 1

      - name: Package artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          mkdir artifact\AyuGram\modules\x64\d3d
          mkdir artifact\AyuGram\TelegramForcePortable\tdata
          copy "%OUT%\AyuGram.exe" artifact\AyuGram\
          copy "%OUT%\modules\x64\d3d\d3dcompiler_47.dll" artifact\AyuGram\modules\x64\d3d\
          7z a -tzip -mx=9 artifact\AyuGram-portable-x64.zip .\artifact\AyuGram\
          if errorlevel 1 exit /b %errorlevel%

      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: AyuGram-portable-x64
          path: artifact\AyuGram-portable-x64.zip
